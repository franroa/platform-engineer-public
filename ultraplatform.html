<style>
  :root{--bg:#060910;--bg2:#0a0f1c;--fg:#e8eefc;--muted:#8b97b8;--line:rgba(130,160,230,.16);--cyan:#7fd4ff;--violet:#b69bff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(1200px 700px at 50% -10%,#0e1830,var(--bg) 60%);color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid;place-items:center;text-align:center;padding:32px}
  .wrap{max-width:560px;display:flex;flex-direction:column;align-items:center}
  .globe{width:clamp(96px,22vw,140px);height:clamp(96px,22vw,140px);margin-bottom:22px;
    color:var(--cyan);filter:drop-shadow(0 0 24px rgba(127,212,255,.35));animation:spin 14s linear infinite}
  .globe .ring{animation:pulse 3.2s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}
  @media (prefers-reduced-motion: reduce){.globe{animation:none}.globe .ring{animation:none}}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--violet);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;margin-bottom:16px}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet)}
  h1{font-size:clamp(22px,3.6vw,30px);font-weight:800;margin:0 0 12px;letter-spacing:-.01em;
    background:linear-gradient(120deg,var(--cyan),var(--violet) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--muted);margin:0 auto 26px;max-width:460px}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .links a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:14px;font-weight:600;
    padding:11px 18px;border-radius:11px;border:1px solid var(--line);color:var(--fg);transition:border-color .2s,transform .15s,background .2s}
  .links a:hover{border-color:rgba(127,212,255,.55);transform:translateY(-1px)}
  .links a.primary{color:#06121f;border-color:transparent;background:linear-gradient(135deg,var(--cyan),var(--violet) 70%)}
</style>

    <g transform="rotate(-24 12 12)">
